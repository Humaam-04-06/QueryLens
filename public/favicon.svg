<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Database Stack Gradient -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Lens Rim Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="glassGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Database Stack (Base & Mid Tiers) -->
  <g opacity="0.85">
    <!-- Bottom Disk -->
    <path d="M12 39 C12 43.5 22 45 28 45 C34 45 44 43.5 44 39 V42 C44 46.5 34 48 28 48 C22 48 12 46.5 12 42 Z" fill="url(#dbGrad)" opacity="0.6" />
    <ellipse cx="28" cy="39" rx="16" ry="4.5" fill="#1e293b" stroke="url(#dbGrad)" stroke-width="1" />

    <!-- Middle Disk -->
    <path d="M12 30 C12 34.5 22 36 28 36 C34 36 44 34.5 44 30 V33 C44 37.5 34 39 28 39 C22 39 12 37.5 12 33 Z" fill="url(#dbGrad)" opacity="0.75" />
    <ellipse cx="28" cy="30" rx="16" ry="4.5" fill="#0f172a" stroke="url(#dbGrad)" stroke-width="1" />

    <!-- Top Disk -->
    <path d="M12 21 C12 25.5 22 27 28 27 C34 27 44 25.5 44 21 V24 C44 28.5 34 30 28 30 C22 30 12 28.5 12 24 Z" fill="url(#dbGrad)" opacity="0.9" />
    <ellipse cx="28" cy="21" rx="16" ry="4.5" fill="#1e1b4b" stroke="url(#dbGrad)" stroke-width="1.2" />
  </g>

  <!-- Magnifying Focus Lens -->
  <g filter="url(#cyanGlow)">
    <!-- Lens Glass Fill -->
    <circle cx="36" cy="31" r="14.5" fill="url(#glassGrad)" />

    <!-- Lens Glass Highlight Arc -->
    <path d="M26 23 A12 12 0 0 1 44 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Lens Outer Ring -->
    <circle cx="36" cy="31" r="14.5" stroke="url(#lensGrad)" stroke-width="3" />

    <!-- Lens Handle -->
    <path d="M46.5 41.5 L55 50" stroke="url(#lensGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M46.5 41.5 L55 50" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

    <!-- Core Target / Optimizer Spark -->
    <circle cx="36" cy="31" r="2.5" fill="#38bdf8" />
    <path d="M36 25 V28 M36 34 V37 M30 31 H33 M39 31 H42" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="36" cy="31" r="1" fill="#ffffff" />
  </g>
</svg>
